<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDUSD Field Report</title>
<meta name="theme-color" content="#002147">
<meta name="description" content="Site investigation and construction field reports with photos, video, GPS and dictated notes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Report">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Zilla+Slab:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field tool; navy brand band with the Plant Operations seal on top, fixed bottom tabs with a capture row; clipboard-style item cards with a gold-and-navy hazard stripe for critical items */
:root{
  --navy:#002147; --navy-2:#0a2d5c; --gold:#ffc930; --on-navy:#ffffff;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d2d9e3; --line-2:#e3e8ef;
  --fg:#0d1b2e; --muted:#56657a; --accent:#002147; --accent-fg:#ffffff; --accent-soft:#e2e8f2;
  --cta:#ffc930; --cta-fg:#002147; --tab-on:#002147;
  --open:#c2410c; --prog:#0f766e; --fixed:#a16207; --ver:#15803d; --crit:#b91c1c; --haz:#ffc930; --haz-2:#002147;
  --overlay:rgba(0,12,28,.93);
  --display:"Zilla Slab",Rockwell,Georgia,serif;
  --label:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --gutter:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#001631; --navy-2:#0a2a52; --gold:#ffc930; --on-navy:#ffffff;
  --bg:#07111e; --surface:#0f1d31; --surface-2:#14263f; --line:#24395a; --line-2:#1c2f4b;
  --fg:#e8eef6; --muted:#9aabc2; --accent:#ffc930; --accent-fg:#002147; --accent-soft:#2b2a1a;
  --cta:#ffc930; --cta-fg:#002147; --tab-on:#ffc930;
  --open:#fb923c; --prog:#2dd4bf; --fixed:#facc15; --ver:#4ade80; --crit:#f87171; --haz:#ffc930; --haz-2:#000c1c;
  --overlay:rgba(0,6,16,.95); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#001631; --navy-2:#0a2a52; --gold:#ffc930; --on-navy:#ffffff;
  --bg:#07111e; --surface:#0f1d31; --surface-2:#14263f; --line:#24395a; --line-2:#1c2f4b;
  --fg:#e8eef6; --muted:#9aabc2; --accent:#ffc930; --accent-fg:#002147; --accent-soft:#2b2a1a;
  --cta:#ffc930; --cta-fg:#002147; --tab-on:#ffc930;
  --open:#fb923c; --prog:#2dd4bf; --fixed:#facc15; --ver:#4ade80; --crit:#f87171; --haz:#ffc930; --haz-2:#000c1c;
  --overlay:rgba(0,6,16,.95); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:var(--gutter);padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);padding-block:8px;border-bottom:3px solid var(--gold);margin-bottom:14px}
.top-in{max-width:780px;margin:0 auto;padding-inline:var(--gutter);display:flex;align-items:center;gap:11px}
.seal{width:46px;height:46px;flex:none;display:block;border-radius:50%}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{font:600 11px/1.2 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{font-size:22px;line-height:1.1;font-weight:700;color:var(--on-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:12px;color:rgba(255,255,255,.72);text-align:right;line-height:1.25}
.stat.warn{color:var(--gold);font-weight:600}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center;line-height:1.15}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:3px;min-width:0}
label.f>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{resize:vertical;min-height:92px;line-height:1.4}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .w{grid-column:1/-1}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.muted{color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.sec-h h2{font-size:18px}
.eyebrow{font:600 12px/1.3 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* inspection header */
.hdr-sum{display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;background:none;border:0;padding:0;text-align:left}
.hdr-sum .t{flex:1;min-width:0}
.hdr-sum h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sum .m{font-size:14px;color:var(--muted)}
.chev{width:22px;height:22px;transition:transform .2s}
.open .chev{transform:rotate(180deg)}
.hdr-body{margin-top:12px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.8;margin-left:4px}

/* item cards */
.items{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{position:relative;display:grid;grid-template-columns:88px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%;overflow:hidden}
.item.crit{padding-left:20px}
.item.crit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(-45deg,var(--haz) 0 7px,var(--haz-2) 7px 14px)}
.thumb{width:88px;height:88px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:12px;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .vb{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600;letter-spacing:.04em}
.ibody{min-width:0;display:flex;flex-direction:column;gap:4px}
.irow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-2)}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor}
.s-Open{color:var(--open)}.s-In-Progress{color:var(--prog)}.s-Fixed{color:var(--fixed)}.s-Verified{color:var(--ver)}
.p-Critical{color:var(--crit);font-weight:700}.p-High{color:var(--open);font-weight:600}
.iloc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inote{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.imeta{font-size:12px;color:var(--muted);font-family:var(--mono)}

.empty{text-align:center;color:var(--muted);padding:28px 16px;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--fg);font-size:19px}
.note-line{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* capture + tab bars */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.cap{max-width:780px;margin:0 auto;padding:8px var(--gutter) 0;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px}
.cap .btn{min-height:48px;padding:6px 8px;font-size:15px}
.tabs{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;background:none;border:0;padding:8px 2px 9px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tab-on)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
#capPhoto{background:var(--cta);color:var(--cta-fg);border-color:var(--cta)}

/* sheets / overlays */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line-2)}
.sheet-bar .in{max-width:780px;margin:0 auto;padding:8px var(--gutter);display:flex;align-items:center;gap:8px}
.sheet-bar .ttl{flex:1;min-width:0;font-family:var(--mono);font-size:14px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{max-width:780px;margin:0 auto;padding:14px var(--gutter) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.mstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mstrip .mt{flex:none;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);position:relative;cursor:pointer;padding:0}
.mstrip .mt img{width:100%;height:100%;object-fit:cover;display:block}
.mstrip .mt .vb{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600}
.mstrip .mt .mk{position:absolute;left:4px;top:4px;background:var(--crit);color:#fff;border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600}
.addm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);min-height:44px;font-weight:600;font-size:14px;cursor:pointer;padding:4px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{color:#fff}
.seg button[aria-pressed="true"].s-Open{background:var(--open)}
.seg button[aria-pressed="true"].s-In-Progress{background:var(--prog)}
.seg button[aria-pressed="true"].s-Fixed{background:var(--fixed)}
.seg button[aria-pressed="true"].s-Verified{background:var(--ver)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b1118}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b1118}}
.mic{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-transform:none;color:var(--accent)}
.mic svg{width:14px;height:14px}
.mic.on{background:var(--open);color:#fff;border-color:var(--open)}
.typeblock{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.from{font-size:13px;color:var(--muted)}
.from b{font-family:var(--mono);font-weight:500}

/* viewer */
.viewer{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
.viewer .vbar{display:flex;gap:8px;padding:10px var(--gutter);align-items:center;flex-wrap:wrap}
.viewer .vbar .sp{flex:1}
.viewer .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.viewer .btn.armed{background:var(--crit);border-color:var(--crit)}
.viewer .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 var(--gutter)}
.viewer .stage img,.viewer .stage video{max-width:100%;max-height:100%;border-radius:6px;display:block}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;padding:10px var(--gutter);font-family:var(--mono);font-size:13px}

/* markup */
.mk-wrap{position:fixed;inset:0;z-index:70;background:#0b0f14;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
.mk-tools{display:flex;gap:6px;padding:8px var(--gutter);flex-wrap:wrap;align-items:center}
.mk-tools .btn{background:#1d2631;border-color:#38475a;color:#fff;min-height:40px;padding:6px 10px;font-size:14px}
.mk-tools .btn[aria-pressed="true"]{background:#fff;color:#0b0f14}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #38475a;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #0b0f14 inset}
.mk-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;touch-action:none}
.mk-stage canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:4px}
.mk-text{display:flex;gap:8px;padding:8px var(--gutter)}
.mk-text input{background:#1d2631;border-color:#38475a;color:#fff}

/* report */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.rep-head{border-bottom:3px solid var(--gold);padding-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.rep-head h2{font-size:24px}
.rep-id{font-family:var(--mono);font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:14px}
.kv div{display:flex;gap:6px;min-width:0}
.kv dt{color:var(--muted);flex:none}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;min-width:0}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.tally span{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600}
.tally b{font-family:var(--mono);font-weight:500;margin-right:4px}
.ritem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ritem h3{font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ritem p{margin:0;overflow-wrap:anywhere}
.ritem .lab{font-weight:600}
.rphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.rphotos .rp{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface-2);position:relative;max-width:100%}
.rphotos img{width:100%;height:100%;object-fit:cover;display:block}
.rphotos .vb{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600}
.exp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.exp{grid-template-columns:1fr}}

/* dashboard */
.dashgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--r);padding:14px}.metric b{display:block;font:700 30px/1 var(--display);color:var(--accent);margin-bottom:5px}.metric span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}.barrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 38px;gap:8px;align-items:center;margin:7px 0;font-size:13px}.bar{height:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.overdue{color:var(--crit);font-weight:700}.dashlist{display:flex;flex-direction:column;gap:7px}.dashitem{border-top:1px solid var(--line-2);padding-top:7px;font-size:14px}.dashitem:first-child{border-top:0;padding-top:0}
@media(max-width:420px){.dashgrid{grid-template-columns:1fr 1fr}}

/* history */
.hist{display:flex;flex-direction:column;gap:10px}
.hcard{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.hcard .thumb{width:72px;height:72px}
.hcard h3{font-size:18px;overflow-wrap:anywhere}
.hcard .m{font-size:14px;color:var(--muted)}
.hcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cur{color:var(--accent);font-weight:700}
.month{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 2px 0}
.hit{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.hit mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 2px}

/* more */
.list{display:flex;flex-direction:column;gap:10px}
.tip{font-size:15px}
.tip h3{font-size:17px;margin-bottom:4px}
.tip ol,.tip ul{margin:4px 0 0;padding-left:20px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}

.rcard{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.rcard h3{font-size:18px;overflow-wrap:anywhere}
.rcard .m{font-size:14px;color:var(--muted)}
.rcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rbadge{width:72px;height:72px;border-radius:8px;display:grid;place-items:center;font:700 15px var(--mono);letter-spacing:.04em;background:var(--navy);color:var(--gold);border:1px solid var(--line)}
.rbadge.xlsx{background:#1d6f42;color:#ffffff}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.clist .crow:first-child{border-top:0;padding-top:0}
.clist .crow:last-child{padding-bottom:0}
.crow>label{display:contents;cursor:pointer}
.cinfo{display:flex;flex-direction:column;min-width:0}
.cinfo b{font-weight:600;overflow-wrap:anywhere}
.cinfo .muted{font-size:13px;overflow-wrap:anywhere}
.sendready{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px}
.sendready .nm{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.warnline{margin:0;font-size:13px;color:var(--open);font-weight:600}
.addr{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.slog{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:4px}
.sentline{font-size:13px;color:var(--ver);font-weight:600}
.ibar{max-width:780px;margin:-4px auto 12px;padding-inline:var(--gutter)}
.ibar .in{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px}
.ibar .in p{margin:0;flex:1;min-width:0}
.ibar .share-ic{display:inline-block;vertical-align:-3px;width:16px;height:16px}
.qr{background:#fff;padding:10px;border-radius:10px;width:200px;max-width:100%;margin:8px auto 4px}
.qr svg{display:block;width:100%;height:auto}
.applink{font-family:var(--mono);font-size:13px;text-align:center;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all;margin:4px 0 10px}
.gps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.gps .gl{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 6px}
.gps .co{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.gps a{color:var(--accent);font-weight:600}
.gps .sp{flex:1}
.ready{position:fixed;left:var(--gutter);right:var(--gutter);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:91;max-width:560px;margin:0 auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:12px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
.ready .nm{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.ready .row{display:flex;gap:8px}
.ready .row .btn{flex:1}
.toast{position:fixed;left:var(--gutter);right:var(--gutter);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:90;max-width:560px;margin:0 auto;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.busy{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:grid;place-items:center}
.busy div{background:var(--surface);color:var(--fg);padding:16px 20px;border-radius:12px;font-weight:600;max-width:80vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const nowTime=()=>new Date().toTimeString().slice(0,5);
const pad3=n=>String(n).padStart(3,"0");
const opts=(arr,v)=>{const a=arr.includes(v)||!v?arr:[...arr,v];return a.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")};
const slug=s=>String(s||"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function abbr(site){const w=String(site||"").replace(/[^A-Za-z0-9 ]/g," ").split(/\s+/).filter(Boolean);if(!w.length)return "SITE";if(w.length===1)return w[0].slice(0,4).toUpperCase();return w.map(x=>/^\d+$/.test(x)?x:x[0]).join("").toUpperCase().slice(0,6)}
const ymd=d=>(d||today()).replace(/-/g,"").slice(2);

/* ---------- storage (IndexedDB on this device) ---------- */
let DB=null, MEM={insp:new Map(),media:new Map(),meta:new Map(),reports:new Map()}, REPS=[];
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("sdusd-field-report",2)}catch(e){return rej(e)}
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("insp"))d.createObjectStore("insp",{keyPath:"id"});if(!d.objectStoreNames.contains("media"))d.createObjectStore("media",{keyPath:"id"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta");if(!d.objectStoreNames.contains("reports"))d.createObjectStore("reports",{keyPath:"id"})};
 r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();toast("Field Report was updated. Close and reopen it to keep saving.",12000)};res(d)};
 r.onerror=()=>rej(r.error);
 // An older copy of the app still open elsewhere holds the database; wait for it rather than running unsaved.
 r.onblocked=()=>{try{$("stat").innerHTML="Finishing update<br>Close other Field Report windows"}catch(e){}}})}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const txDone=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error||new Error("aborted"))});
async function dbPut(store,val,key){if(!DB){MEM[store].set(key??val.id,val);return}const t=DB.transaction(store,"readwrite");key===undefined?t.objectStore(store).put(val):t.objectStore(store).put(val,key);await txDone(t)}
async function dbGet(store,key){if(!DB)return MEM[store].get(key);return rq(DB.transaction(store).objectStore(store).get(key))}
async function dbDel(store,key){if(!DB){MEM[store].delete(key);return}const t=DB.transaction(store,"readwrite");t.objectStore(store).delete(key);await txDone(t)}
async function dbAll(store){if(!DB)return[...MEM[store].values()];return rq(DB.transaction(store).objectStore(store).getAll())}

/* ---------- media ---------- */
function shrinkImage(file,max=1600){return new Promise(res=>{const u=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b?{blob:b,w:c.width,h:c.height}:null),"image/jpeg",.82)};
 img.onerror=()=>{URL.revokeObjectURL(u);res(null)};img.src=u})}
function videoPoster(blob){return new Promise(res=>{const u=URL.createObjectURL(blob),v=document.createElement("video");let done=false;
 const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);v.removeAttribute("src");try{v.load()}catch(e){}res(r)};
 const t=setTimeout(()=>fin(null),6000);v.muted=true;v.playsInline=true;v.preload="auto";
 v.onloadeddata=()=>{try{v.currentTime=Math.min(.5,(v.duration||1)/3)}catch(e){fin(null)}};
 v.onseeked=()=>{try{const k=Math.min(1,960/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(v.videoWidth*k));c.height=Math.max(1,Math.round(v.videoHeight*k));c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{clearTimeout(t);fin(b)},"image/jpeg",.8)}catch(e){clearTimeout(t);fin(null)}};
 v.onerror=()=>{clearTimeout(t);fin(null)};v.src=u})}
async function mediaURL(id){if(urlCache.has(id))return urlCache.get(id);const m=await dbGet("media",id);if(!m)return null;
 const o={url:URL.createObjectURL(m.blob),poster:m.poster?URL.createObjectURL(m.poster):null,kind:m.kind,type:m.type,marked:!!m.orig};
 urlCache.set(id,o);mediaMeta.set(id,{kind:m.kind,type:m.type,name:m.name,marked:!!m.orig});return o}
function dropURL(id){const o=urlCache.get(id);if(o){URL.revokeObjectURL(o.url);if(o.poster)URL.revokeObjectURL(o.poster)}urlCache.delete(id)}
async function hydrate(root=document){const els=root.querySelectorAll("[data-mid]");for(const el of els){const id=el.dataset.mid;if(!id)continue;const o=await mediaURL(id);if(!o)continue;
 const src=o.kind==="video"?o.poster:o.url;
 if(el.tagName==="IMG"){if(src)el.src=src;else{el.replaceWith(Object.assign(document.createElement("span"),{textContent:"Video"}))}}
 const vb=el.parentElement&&el.parentElement.querySelector(".vb");if(vb)vb.hidden=o.kind!=="video";
 const mk=el.parentElement&&el.parentElement.querySelector(".mk");if(mk)mk.hidden=!o.marked}}

async function addMedia(files,item){if(!files.length)return;const I=cur();busy("Adding "+files.length+" file"+(files.length>1?"s":"")+"…");let added=0;
 for(const f of files){try{
  if((f.type||"").startsWith("video")||/\.(mov|mp4|m4v|webm|3gp)$/i.test(f.name||"")){
   if(f.size>MAX_VIDEO){toast("A video over 250 MB was skipped. Record shorter clips or set the camera to 1080p.");continue}
   const poster=await videoPoster(f);const id=uid();
   await dbPut("media",{id,kind:"video",blob:f,poster,type:f.type||"video/mp4",name:f.name||"video.mp4",size:f.size,created:new Date().toISOString()});
   item.media.push(id);added++;
  }else{
   const r=await shrinkImage(f);if(!r){toast("One photo couldn't be read and was skipped. Try saving it as JPEG.");continue}
   const id=uid();await dbPut("media",{id,kind:"image",blob:r.blob,type:"image/jpeg",name:f.name||"photo.jpg",w:r.w,h:r.h,size:r.blob.size,created:new Date().toISOString()});
   item.media.push(id);added++}
 }catch(e){toast(storageMsg(e))}}
 busy(false);saveInsp(I);return added}
function storageMsg(e){return e&&(e.name==="QuotaExceededError"||/quota/i.test(e.message||""))?"This device is out of space for the app. Back up, then delete old inspections.":"Couldn't save that file on this device."}
function mediaUsedElsewhere(id,exceptItem){for(const I of S.insps)for(const x of I.items){if(x===exceptItem)continue;if(x.media.includes(id))return true}return false}
async function deleteMediaRef(item,id){item.media=item.media.filter(m=>m!==id);if(!mediaUsedElsewhere(id,item)){try{await dbDel("media",id)}catch(e){}dropURL(id)}}

/* ---------- dictation ---------- */
let rec=null;
function dictate(ta,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const reset=()=>{rec=null;document.querySelectorAll(".mic.on").forEach(b=>{b.classList.remove("on");b.lastChild.textContent=" Dictate"})};
 const fallback=()=>{reset();ta.focus();toast(isIOS?"Tap the microphone on the iPhone keyboard to dictate into this box.":"Tap the microphone on your keyboard to dictate into this box.",7000)};
 if(rec){try{rec.stop()}catch(e){}reset();return}
 if(!SR)return fallback();
 try{rec=new SR()}catch(e){return fallback()}
 rec.lang="en-US";rec.continuous=true;rec.interimResults=false;btn.classList.add("on");btn.lastChild.textContent=" Stop";
 rec.onresult=e=>{let s="";for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)s+=e.results[i][0].transcript+" ";s=s.trim();if(!s)return;
  s=s.charAt(0).toUpperCase()+s.slice(1);ta.value=(ta.value?ta.value.trimEnd()+" ":"")+s;ta.dispatchEvent(new Event("input",{bubbles:true}))};
 rec.onerror=e=>{if(e.error==="no-speech"||e.error==="aborted")return;fallback()};
 rec.onend=()=>{if(rec)reset()};
 try{rec.start()}catch(e){fallback()}}

const IN_CLAUDE=(()=>{try{return window.self!==window.top&&/claude/i.test(location.hostname+" "+document.referrer)}catch(e){return true}})();
const PWA=!IN_CLAUDE&&(window.isSecureContext||location.hostname==="localhost");
let geoWarned=false,geoBusy=new Set();
const fmtGps=g=>g?`${(+g.lat).toFixed(6)}, ${(+g.lng).toFixed(6)}${g.acc!=null?" (±"+g.acc+" m)":""}`:"";
const mapURL=g=>`https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}`;
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res({err:"unsupported"});
 try{navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:new Date().toISOString()}),
  e=>res({err:e.code===1?"denied":e.code===3?"timeout":"unavailable"}),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}catch(e){res({err:"denied"})}})}
function geoMsg(err){if(IN_CLAUDE)return"GPS isn't available when the app runs inside Claude. Use the installed version of the app to tag locations.";
 if(!PWA)return"GPS needs the app opened from its https:// web address, not from a file saved on the phone.";
 if(err==="denied")return isIOS?"Location is off for this app. Turn it on in Settings › Privacy & Security › Location Services, then try again.":"Location is blocked for this app. Allow it in Chrome's site settings or your phone's location settings, then try again.";
 if(err==="timeout")return"Couldn't get a GPS fix. Step outside or near a window and tap Tag GPS again.";
 return"GPS isn't available on this device."}
async function tagItem(I,x,manual){if(!manual&&!S.settings.gps)return;if(geoBusy.has(x.id))return;geoBusy.add(x.id);if(editing===x.id)updateGpsUI(x);
 const g=await getPos();geoBusy.delete(x.id);
 if(g.err){if(manual||!geoWarned){geoWarned=true;toast(geoMsg(g.err),8000)}}
 else{x.gps=g;if(!I.info.gps)I.info.gps={...g};saveInsp(I)}
 if(editing===x.id)updateGpsUI(x);else if(S.view==="insp"&&$("sheet").hidden)render()}
function gpsHTML(x){if(geoBusy.has(x.id))return`<span class="gl">GPS</span><span class="muted">Getting location…</span>`;
 if(x.gps)return`<span class="gl">GPS</span><span class="co">${esc(fmtGps(x.gps))}</span><a href="${mapURL(x.gps)}" target="_blank" rel="noopener">Map</a><span class="sp"></span><button type="button" class="btn sm" data-gps="set">Update</button><button type="button" class="btn sm ghost" data-gps="clear">Remove</button>`;
 return`<span class="gl">GPS</span><span class="muted">Not tagged</span><span class="sp"></span><button type="button" class="btn sm" data-gps="set">Tag GPS location</button>`}

/* ---------- markup ---------- */
const MK={id:null,img:null,shapes:[],tool:"arrow",color:"#ef2b2b",drawing:null,canvas:null,scale:1,pendingText:null};
async function openMarkup(id){const m=await dbGet("media",id);if(!m)return;const base=m.orig||m.blob;const u=URL.createObjectURL(base),img=new Image();
 img.onload=()=>{MK.id=id;MK.img=img;MK.url=u;MK.shapes=[];MK.pendingText=null;$("markup").hidden=false;renderMarkup()};img.src=u}
function renderMarkup(){const cols=[["#ef2b2b","Red"],["#ffd21a","Yellow"],["#ffffff","White"],["#1e8bff","Blue"]];
 $("markup").innerHTML=`<div class="mk-tools">
  ${[["arrow","Arrow"],["circle","Circle"],["box","Box"],["pen","Draw"],["text","Text"]].map(([k,l])=>`<button type="button" class="btn" data-tool="${k}" aria-pressed="${MK.tool===k}">${l}</button>`).join("")}
  <span style="flex:1"></span>${cols.map(([c,l])=>`<button type="button" class="sw" data-color="${c}" aria-label="${l}" aria-pressed="${MK.color===c}" style="background:${c}"></button>`).join("")}</div>
 <div class="mk-stage" id="mkStage"><canvas id="mkCanvas"></canvas></div>
 <div class="mk-text" id="mkText" hidden><input id="mkTextIn" placeholder="Label text, then tap Add" autocomplete="off"><button type="button" class="btn" id="mkTextAdd" style="background:#fff;color:#0b0f14">Add</button></div>
 <div class="mk-tools"><button type="button" class="btn" id="mkCancel">Cancel</button><button type="button" class="btn" id="mkUndo">Undo</button><span style="flex:1"></span><button type="button" class="btn" id="mkSave" style="background:#fff;color:#0b0f14">Save markup</button></div>`;
 const c=$("mkCanvas"),st=$("mkStage");MK.canvas=c;
 requestAnimationFrame(()=>{const W=st.clientWidth-16,H=st.clientHeight-8,k=Math.min(W/MK.img.naturalWidth,H/MK.img.naturalHeight,1);
  MK.scale=k;const dpr=window.devicePixelRatio||1;c.width=Math.round(MK.img.naturalWidth*k*dpr);c.height=Math.round(MK.img.naturalHeight*k*dpr);c.style.width=Math.round(MK.img.naturalWidth*k)+"px";c.style.height=Math.round(MK.img.naturalHeight*k)+"px";drawMarkup()});
 c.addEventListener("pointerdown",mkDown);c.addEventListener("pointermove",mkMove);c.addEventListener("pointerup",mkUp);c.addEventListener("pointercancel",mkUp)}
function mkPt(e){const r=MK.canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width*MK.img.naturalWidth,(e.clientY-r.top)/r.height*MK.img.naturalHeight]}
function mkDown(e){e.preventDefault();const p=mkPt(e);
 if(MK.tool==="text"){MK.pendingText=p;$("mkText").hidden=false;$("mkTextIn").value="";$("mkTextIn").focus();return}
 MK.canvas.setPointerCapture(e.pointerId);MK.drawing={tool:MK.tool,color:MK.color,pts:[p,p]};}
function mkMove(e){if(!MK.drawing)return;const p=mkPt(e);if(MK.drawing.tool==="pen")MK.drawing.pts.push(p);else MK.drawing.pts[1]=p;drawMarkup()}
function mkUp(){if(!MK.drawing)return;const d=MK.drawing;MK.drawing=null;const[a,b]=[d.pts[0],d.pts[d.pts.length-1]];if(d.tool==="pen"?d.pts.length>2:Math.hypot(b[0]-a[0],b[1]-a[1])>6)MK.shapes.push(d);drawMarkup()}
function drawShapes(ctx,W,shapes){const lw=Math.max(3,W/180);ctx.lineCap="round";ctx.lineJoin="round";
 for(const s of shapes){ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=lw;const[a,b]=[s.pts[0],s.pts[s.pts.length-1]];
  ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=lw*1.2;
  if(s.tool==="pen"){ctx.beginPath();s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
  else if(s.tool==="box"){ctx.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))}
  else if(s.tool==="circle"){ctx.beginPath();ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.max(1,Math.abs(b[0]-a[0])/2),Math.max(1,Math.abs(b[1]-a[1])/2),0,0,Math.PI*2);ctx.stroke()}
  else if(s.tool==="arrow"){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),h=lw*5;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0]-Math.cos(ang)*h*.6,b[1]-Math.sin(ang)*h*.6);ctx.stroke();
   ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-h*Math.cos(ang-.45),b[1]-h*Math.sin(ang-.45));ctx.lineTo(b[0]-h*Math.cos(ang+.45),b[1]-h*Math.sin(ang+.45));ctx.closePath();ctx.fill()}
  else if(s.tool==="text"){ctx.shadowBlur=0;const fs=Math.max(18,W/26);ctx.font=`700 ${fs}px Barlow, Arial, sans-serif`;const tw=ctx.measureText(s.text).width,pad=fs*.3;
   ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(a[0]-pad,a[1]-fs-pad*.5,tw+pad*2,fs+pad*1.4);ctx.fillStyle=s.color;ctx.textBaseline="alphabetic";ctx.fillText(s.text,a[0],a[1])}
  ctx.shadowBlur=0}}
function drawMarkup(){const c=MK.canvas,ctx=c.getContext("2d"),k=c.width/MK.img.naturalWidth;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.setTransform(k,0,0,k,0,0);ctx.drawImage(MK.img,0,0);
 drawShapes(ctx,MK.img.naturalWidth,MK.drawing?[...MK.shapes,MK.drawing]:MK.shapes)}
function closeMarkup(){if(MK.url)URL.revokeObjectURL(MK.url);$("markup").hidden=true;$("markup").innerHTML="";MK.img=null}
$("markup").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tool){MK.tool=b.dataset.tool;$("markup").querySelectorAll("[data-tool]").forEach(y=>y.setAttribute("aria-pressed",y===b));if(MK.tool!=="text")$("mkText").hidden=true;return}
 if(b.dataset.color){MK.color=b.dataset.color;$("markup").querySelectorAll("[data-color]").forEach(y=>y.setAttribute("aria-pressed",y===b));return}
 if(b.id==="mkTextAdd"){const v=$("mkTextIn").value.trim();if(v&&MK.pendingText)MK.shapes.push({tool:"text",color:MK.color,pts:[MK.pendingText],text:v});MK.pendingText=null;$("mkText").hidden=true;drawMarkup();return}
 if(b.id==="mkUndo"){MK.shapes.pop();drawMarkup();return}
 if(b.id==="mkCancel")return closeMarkup();
 if(b.id==="mkSave"){if(!MK.shapes.length)return closeMarkup();const W=MK.img.naturalWidth,H=MK.img.naturalHeight,c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");ctx.drawImage(MK.img,0,0);drawShapes(ctx,W,MK.shapes);
  c.toBlob(async blob=>{const m=await dbGet("media",MK.id);if(m&&blob){if(!m.orig)m.orig=m.blob;m.blob=blob;m.size=blob.size;await dbPut("media",m);dropURL(MK.id)}closeMarkup();renderViewer();toast("Markup saved. The original is kept in case you want to undo it.")},"image/jpeg",.85)}});
$("markup").addEventListener("keydown",e=>{if(e.target.id==="mkTextIn"&&e.key==="Enter"){e.preventDefault();$("mkTextAdd").click()}});

function ageDays(x){const d=(x.created||"").slice(0,10);if(!d)return 0;return Math.max(0,Math.floor((new Date(today())-new Date(d))/864e5))}
function overdue(x){return isOpen(x)&&x.due&&x.due<today()}
function groupCounts(items,keyfn){const m={};items.forEach(x=>{const k=keyfn(x)||"Unassigned";m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(rows,total){const max=Math.max(1,...rows.map(r=>r[1]));return rows.slice(0,8).map(([k,n])=>`<div class="barrow"><span>${esc(k)}</span><span class="bar"><i style="width:${n/max*100}%"></i></span><b>${n}</b></div>`).join("")||`<p class="muted">No data yet.</p>`}
function viewDash(){const I=cur(),its=I.items,T=tally(its),open=its.filter(isOpen),od=open.filter(overdue),crit=open.filter(isSafety),avg=open.length?Math.round(open.reduce((a,x)=>a+ageDays(x),0)/open.length):0;
 const pct=its.length?Math.round(its.filter(x=>x.status==="Verified").length/its.length*100):0;
 const contractors=groupCounts(open,x=>x.responsible),trades=groupCounts(open,x=>x.trade),due=od.sort((a,b)=>(a.due||"").localeCompare(b.due||"")).slice(0,8);
 return`<div class="sec-h" style="margin-top:4px"><h2>Project Dashboard</h2><span class="eyebrow">${esc(I.info.site||"Current inspection")}</span></div>
 <div class="dashgrid"><div class="metric"><b>${its.length}</b><span>Total observations</span></div><div class="metric"><b>${open.length}</b><span>Open / active</span></div><div class="metric"><b class="${crit.length?'overdue':''}">${crit.length}</b><span>Safety / critical open</span></div><div class="metric"><b class="${od.length?'overdue':''}">${od.length}</b><span>Overdue</span></div><div class="metric"><b>${avg}</b><span>Avg. open age (days)</span></div><div class="metric"><b>${pct}%</b><span>Verified complete</span></div></div>
 <div class="sec-h"><h2>Status</h2></div><section class="card">${bars([["Open",T.Open],["In Progress",T["In Progress"]],["Fixed",T.Fixed],["Verified",T.Verified]],Math.max(1,its.length))}</section>
 <div class="sec-h"><h2>Open items by trade</h2></div><section class="card">${bars(trades,open.length)}</section>
 <div class="sec-h"><h2>Open items by responsible party</h2></div><section class="card">${bars(contractors,open.length)}</section>

   <div class="card clist">${cs.length?cs.map(c=>`<div class="crow"><label><input type="checkbox" id="cid-${c.id}" data-cid="${c.id}"${sel.includes(c.id)?" checked":""}><span class="cinfo"><b>${esc(c.name||c.email)}</b><span class="muted">${esc([c.role,c.email].filter(Boolean).join(" · "))}</span></span></label><button type="button" class="btn sm ghost" data-cdel="${c.id}" aria-label="Remove ${esc(c.name||c.email)}">Remove</button></div>`).join("")
    :`<p class="muted" style="margin:0">No stakeholders yet. Add the people who should get reports. They're saved on this phone and picked automatically for this project next time.</p>`}</div>
   ${SEND.adding?addForm():`<div class="grid2" style="margin-top:8px"><button type="button" class="btn sm" id="sAdd">Add stakeholder</button>${canPickContacts()?`<button type="button" class="btn sm" id="sPick">From phone contacts</button>`:cs.length>1?`<button type="button" class="btn sm" id="sAll">${sel.length===cs.length?"Clear all":"Select all"}</button>`:""}</div>`}
  </section>

   <p class="muted" style="font-size:13px;margin:6px 0 0">${SEND.fmt==="zip"?"Includes the PDF, Excel and every original photo and video. Often too large for email, so share it to Google Drive or OneDrive.":SEND.fmt==="pdfx"?"The PDF for reading and the Excel file for tracking items.":"Photos, notes, GPS and a signature line. Best for most stakeholders."}</p></section>
  <label class="f"><span>Subject</span><input id="sSubj" value="${esc(SEND.subject)}"></label>

  <div id="sGo">${goHTML()}</div>
  <div class="grid2"><button type="button" class="btn" id="sMail">Summary email</button><button type="button" class="btn" id="sCopy"${emails.length?"":" disabled"}>Copy addresses</button></div>
  <p class="muted" style="font-size:13px;margin:0">Summary email opens your mail app with recipients, subject and message filled in, without an attachment.${emails.length?"":" Select recipients above to fill in the To line."}</p>
  ${emails.length?`<p class="addr">${esc(emails.join(", "))}</p>`:""}
  ${log.length?`<section><span class="eyebrow">Send log</span><div class="slog">${log.map(l=>`<div>${esc(new Date(l.t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))} · ${esc(l.what)} · ${esc(l.to.length?l.to.join(", "):"recipients chosen in the mail app")}</div>`).join("")}</div></section>`:""}
 </div>`}
function logSent(I,what,to){I.sent=I.sent||[];I.sent.push({t:new Date().toISOString(),what,to});saveInsp(I,true);markSent(I,to)}
async function prepSend(btn){const{I}=SEND;btn.disabled=true;btn.textContent="Building…";
 try{await flushSaves();const files=[];
  if(SEND.fmt==="zip"){busy("Building package…");files.push(new File([await buildZip(I)],baseName(I,"Field-Report-Package")+".zip",{type:MIME.zip}))}
  else{busy("Building PDF…");files.push(new File([await buildPdf(I)],baseName(I,"Field-Report")+".pdf",{type:MIME.pdf}));
   if(SEND.fmt==="pdfx"){busy("Building Excel…");files.push(new File([await buildXlsx(I)],baseName(I,"Observations")+".xlsx",{type:MIME.xlsx}))}}
  SEND.files=files;SEND.size=files.reduce((a,f)=>a+f.size,0);
  for(const f of files){const k=f.name.split(".").pop().toLowerCase();if(k==="pdf"||k==="xlsx")await keepReport(I,f,f.name,k)}
  let can=false;try{can=!!(navigator.share&&navigator.canShare&&navigator.canShare({files}))}catch(e){}
  SEND.mode=IN_CLAUDE?"claude":can?"share":"mail";
 }catch(e){toast((e&&e.message)||"Couldn't build the report.")}
 busy(false);if(SEND)$("sGo").innerHTML=goHTML()}
async function doShare(){const{I,files}=SEND,emails=distPeople(I).map(c=>c.email),what=SEND.fmt==="zip"?"Full package":SEND.fmt==="pdfx"?"PDF + Excel":"PDF";
 if(SEND.mode==="claude"){let ok=false;for(const f of files)ok=(await saveFile(f,f.name))||ok;if(ok){logSent(I,what,emails);if(emails.length)copyText(emails.join(", "),"Saved. Recipient addresses copied for your email.");renderSend()}return}
 if(SEND.mode==="share"){
  if(emails.length)try{navigator.clipboard.writeText(emails.join(", ")).catch(()=>{})}catch(e){}
  try{await navigator.share({files,title:SEND.subject,text:SEND.body})}
  catch(e){if(e&&e.name==="AbortError")return;
   try{await navigator.share({files,title:SEND.subject})}catch(e2){if(!e2||e2.name!=="AbortError")toast("Couldn't open the share menu. Use Summary email, or save the report from the Report tab.");return}}
  logSent(I,what,emails);toast(emails.length?"Handed to your app. If the To line is blank, paste: the addresses are copied.":"Handed to your app.",8000);renderSend();return}
 for(const f of files)downloadBlob(f,f.name);
 setTimeout(()=>openMail(emails,SEND.subject,SEND.body+"\n\nAttached: "+files.map(f=>f.name).join(", ")),400);
 logSent(I,what,emails);toast("Files saved. Attach them to the email that opens.",9000);renderSend()}
async function pickContacts(){try{const r=await navigator.contacts.select(["name","email"],{multiple:true});let n=0;const ids=[...distFor(SEND.I)];
  for(const c of r||[]){const email=((c.email||[])[0]||"").trim();if(!validEmail(email))continue;let ex=contacts().find(x=>x.email.toLowerCase()===email.toLowerCase());
   if(!ex){ex={id:uid(),name:((c.name||[])[0]||email).trim(),email,role:""};contacts().push(ex);n++}ids.push(ex.id)}
  setDist(SEND.I,ids);renderSend();toast(n?n+" stakeholder"+(n===1?"":"s")+" added.":"Recipients selected.")}catch(e){}}
$("send").addEventListener("input",e=>{if(!SEND)return;if(e.target.id==="sSubj")SEND.subject=e.target.value;if(e.target.id==="sBody")SEND.body=e.target.value});
$("send").addEventListener("change",e=>{const el=e.target;if(!SEND||!el.dataset.cid)return;const ids=distFor(SEND.I).filter(i=>i!==el.dataset.cid);if(el.checked)ids.push(el.dataset.cid);setDist(SEND.I,ids);
 const y=$("send").scrollTop;renderSend();$("send").scrollTop=y});
$("send").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||!SEND)return;const I=SEND.I,keep=()=>{const y=$("send").scrollTop;renderSend();$("send").scrollTop=y};
 if(b.id==="sClose")return closeSend();
 if(b.dataset.mic){const ta=$(b.dataset.mic);if(ta)dictate(ta,b);return}
 if(b.id==="sAdd"){SEND.adding=true;keep();setTimeout(()=>{const n=$("cName");if(n)n.focus()},50);return}
 if(b.id==="cCancel"){SEND.adding=false;keep();return}
 if(b.id==="cSave"){const name=$("cName").value.trim(),email=$("cEmail").value.trim(),role=$("cRole").value;
  if(!validEmail(email)){toast("Enter a valid email address, like name@sandi.net.");$("cEmail").focus();return}
  let c=contacts().find(x=>x.email.toLowerCase()===email.toLowerCase());if(c){if(name)c.name=name;if(role)c.role=role}else{c={id:uid(),name:name||email,email,role};contacts().push(c)}
  SEND.adding=false;setDist(I,[...distFor(I),c.id]);keep();toast((c.name||c.email)+" added and selected.");return}
 if(b.id==="sPick")return pickContacts();
 if(b.id==="sAll"){const all=contacts().map(c=>c.id);setDist(I,distFor(I).length===all.length?[]:all);keep();return}
 if(b.dataset.cdel){const id=b.dataset.cdel;return arm(b,"cdel"+id,"Tap to remove",()=>{S.settings.contacts=contacts().filter(c=>c.id!==id);saveMeta();if(SEND)SEND.files=null;keep()})}
 if(b.dataset.fmt){if(SEND.fmt!==b.dataset.fmt){SEND.fmt=b.dataset.fmt;SEND.files=null}keep();return}
 if(b.id==="sPrep")return prepSend(b);
 if(b.id==="sShare")return doShare();
 if(b.id==="sMail"){const emails=distPeople(I).map(c=>c.email);openMail(emails,SEND.subject,SEND.body.replace(/^Attached is the /m,"Here is a summary of the "));logSent(I,"Summary email",emails);keep();return}
 if(b.id==="sCopy"){copyText(distPeople(I).map(c=>c.email).join(", "),"Addresses copied.");return}});

/* ---------- saved reports archive ---------- */
async function keepReport(I,blob,name,kind){try{const i=I.info,now=Date.now();
  // building the same file again within a few minutes replaces the earlier copy
  for(const r of REPS.filter(r=>r.inspId===I.id&&r.kind===kind&&now-new Date(r.t)<180000)){try{await dbDel("reports",r.id)}catch(e){}REPS=REPS.filter(x=>x!==r)}
  const rec={id:uid(),inspId:I.id,t:new Date().toISOString(),name,kind,size:blob.size,blob,site:i.site,area:i.area,date:i.date,type:i.type,rid:reportId(I),items:I.items.length,open:I.items.filter(isOpen).length,via:"saved",to:[]};
  await dbPut("reports",rec);REPS.push(rec)}catch(e){}}
async function markSent(I,to){const now=Date.now();for(const r of REPS.filter(r=>r.inspId===I.id&&now-new Date(r.t)<1800000)){r.via="sent";r.to=to||[];r.sentAt=new Date().toISOString();try{await dbPut("reports",r)}catch(e){}}}
function repList(){const q=S.q.trim().toLowerCase();
 const L=[...REPS].filter(r=>!q||[r.site,r.area,r.rid,r.type,r.date,fmtDate(r.date),r.name,(r.to||[]).join(" ")].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.t.localeCompare(a.t));
 if(!L.length)return`<div class="empty">${q?"No saved reports match.":"<h3>No saved reports yet</h3><span>Every PDF and Excel file you make or send from now on is kept here, so you can share it again any time.</span>"}</div>`;
 let last="";return L.map(r=>{const d=new Date(r.t),mo=d.toLocaleString(undefined,{month:"long",year:"numeric"}),h=mo!==last?`<h3 class="month">${esc(mo)}</h3>`:"";last=mo;
  const gone=!S.insps.some(x=>x.id===r.inspId);
  return h+`<div class="rcard" data-rep="${r.id}"><span class="rbadge ${r.kind}">${r.kind==="xlsx"?"XLSX":"PDF"}</span><div style="min-width:0">
   <h3>${esc(r.site||"Untitled site")}${r.area?" · "+esc(r.area):""}</h3>
   <div class="m">${esc(r.type||"")} · ${esc(fmtDate(r.date))} · <span style="font-family:var(--mono)">${esc(r.rid)}</span></div>
   <div class="m">Made ${esc(d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))} · ${fmtBytes(r.size||0)} · ${r.items} items, ${r.open} open</div>
   ${r.via==="sent"?`<div class="sentline">Sent${r.to&&r.to.length?" to "+esc(r.to.join(", ")):""}</div>`:""}
   <div class="acts"><button type="button" class="btn sm pri" data-r="share">Share / save</button>${gone?"":`<button type="button" class="btn sm" data-r="insp">Open inspection</button>`}<button type="button" class="btn sm danger" data-r="del">Delete</button></div>
  </div></div>`}).join("")}

/* ---------- app events ---------- */
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;S.view=t.dataset.view;render();window.scrollTo(0,0)});
$("app").addEventListener("input",e=>{const el=e.target,I=cur();
 if(el.dataset.h&&el.tagName!=="BUTTON"){I.info[el.dataset.h]=el.value;saveInsp(I);if(el.dataset.h==="site"||el.dataset.h==="date"){const h=$("hdrCard").querySelector("h2");if(h&&el.dataset.h==="site")h.textContent=el.value||"New inspection"}return}
 if(el.id==="hq"){S.q=el.value;$("hlist").innerHTML=histBody();hydrate($("hlist"));return}
 if(el.dataset.sb){S.settings[el.dataset.sb]=el.checked;saveMeta();return}
 if(el.dataset.s){S.settings[el.dataset.s]=el.value;saveMeta();$("orgLine").textContent=S.settings.dept||S.settings.org||"Field Report"}});
$("app").addEventListener("change",e=>{if(e.target.dataset.sb){S.settings[e.target.dataset.sb]=e.target.checked;saveMeta();return}if(e.target.id==="hType"){S.qType=e.target.value;$("hlist").innerHTML=histBody();hydrate($("hlist"))}
 if(e.target.dataset.h==="date"||e.target.dataset.h==="type"){const I=cur();I.info[e.target.dataset.h]=e.target.value;saveInsp(I);if(e.target.dataset.h==="type")render()}});
$("app").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="hdrToggle"){S.hdrOpen=!S.hdrOpen;render();return}
 if(b.id==="hGps"){const I=cur();b.disabled=true;b.textContent="Getting location…";const g=await getPos();if(g.err)toast(geoMsg(g.err),8000);else{I.info.gps=g;saveInsp(I)}render();return}
 if(b.dataset.filter){S.filter=b.dataset.filter;render();return}
 if(b.dataset.open){openEditor(b.dataset.open);return}
 if(b.id==="loadSample"){await loadSample();return}
 if(b.dataset.exp){const I=cur();if(!I.items.length){toast("Add at least one observation first.");return}
  return b.dataset.exp==="pdf"?exportPdf(I,b):b.dataset.exp==="xlsx"?exportXlsx(I,b):exportZip(I,b)}
 if(b.id==="rSend"){const I=cur();if(!I.items.length){toast("Add at least one observation first.");return}openSend(I);return}
 if(b.dataset.htab){S.hTab=b.dataset.htab;S.q="";render();return}
 const rc=b.closest(".rcard");if(rc){const r=REPS.find(x=>x.id===rc.dataset.rep);if(!r)return;const a=b.dataset.r;
  if(a==="share"){saveFile(r.blob,r.name,"Saved report from "+new Date(r.t).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"})+".");return}
  if(a==="insp"){const I=S.insps.find(x=>x.id===r.inspId);if(!I){toast("That inspection was deleted. The saved report is still here.");return}S.cur=I.id;saveMeta();S.view="insp";S.filter="all";S.hdrOpen=false;render();window.scrollTo(0,0);return}
  if(a==="del")return arm(b,"rdel"+r.id,"Tap to delete",async()=>{try{await dbDel("reports",r.id)}catch(e){}REPS=REPS.filter(x=>x!==r);render();toast("Saved report deleted.")});
  return}
 if(b.id==="hNew"){startNew();return}
 if(b.id==="hXlsx"){exportAll(b);return}
 if(b.id==="mBackup"){backupAll(b);return}
 if(b.id==="mRestore"){$("inRestore").click();return}
 if(b.id==="mShareApp"){shareApp();return}
 if(b.id==="mCopyApp"){copyText(appURL(),"App link copied.");return}
 if(b.id==="mInstall"&&installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render();return}
 const hc=b.closest(".hcard");if(hc){const I=S.insps.find(x=>x.id===hc.dataset.insp);if(!I)return;const a=b.dataset.h;
  if(a==="open"){S.cur=I.id;saveMeta();S.view="insp";S.filter="all";S.hdrOpen=!I.items.length;render();window.scrollTo(0,0);return}
  if(a==="follow"){followUp(I);return}
  if(a==="pdf"){exportPdf(I,b);return}
  if(a==="send"){if(!I.items.length){toast("This inspection has no observations yet.");return}openSend(I);return}
  if(a==="reps"){S.hTab="reps";S.q=reportId(I).toLowerCase();render();return}
  if(a==="del")return arm(b,"hdel"+I.id,"Tap to delete",async()=>{await deleteInsp(I);render();toast("Inspection deleted.")})}});

function startNew(){const I=cur();if(I&&!I.items.length&&!I.info.site){S.view="insp";S.hdrOpen=true;render();toast("This inspection is still blank. Fill in the site to begin.");return}
 const N=newInsp(I?{...I.info,area:"",project:I.info.project,projectNo:I.info.projectNo}:null);S.insps.push(N);S.cur=N.id;S.hdrOpen=true;S.filter="all";saveInsp(N,true);saveMeta();S.view="insp";render();window.scrollTo(0,0);toast("New inspection started. Past ones are in History.")}
function followUp(P){const N=newInsp(P.info);N.info.type=P.info.type==="Punch List"||P.info.type==="Warranty Walk"?P.info.type:"Site Investigation";
 for(const x of P.items.filter(isOpen)){const y=newItem(N,x.type);Object.assign(y,JSON.parse(JSON.stringify({...x,id:y.id,seq:y.seq,created:y.created})));y.carriedFrom=itemCode(P,x);y.followup=x.followup?x.followup+"\n":"";y.media=[...x.media];N.items.push(y)}
 S.insps.push(N);S.cur=N.id;S.hdrOpen=false;S.filter="all";saveInsp(N,true);saveMeta();S.view="insp";render();window.scrollTo(0,0);
 toast(N.items.length+" open item"+(N.items.length===1?"":"s")+" carried over. Update each status as you walk.")}
async function deleteInsp(I){S.insps=S.insps.filter(x=>x!==I);for(const x of I.items)for(const m of x.media){if(!mediaUsedElsewhere(m,null)){try{await dbDel("media",m)}catch(e){}dropURL(m)}}
 try{await dbDel("insp",I.id)}catch(e){}
 if(S.cur===I.id){const L=[...S.insps].sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));if(L[0])S.cur=L[0].id;else{const N=newInsp();S.insps.push(N);S.cur=N.id;saveInsp(N,true)}saveMeta()}}

/* ---------- file output ---------- */
let DL;async function getDL(){if(DL!==undefined)return DL;try{DL=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){DL=null}return DL}
async function saveFile(blob,name,note){const dl=await getDL();
 if(dl){try{await dl.save({filename:name,data:blob});toast("Saved "+name);return true}catch(e){const c=e&&e.code;if(c==="declined")return false;if(c==="too_large"){toast("That file is too large to save here. Try PDF or Excel on their own.");return false}if(c==="rate_limited"){toast("A save is already waiting for you to confirm.");return false}}}
 return readyBar(blob,name,note)}
const MIME={pdf:"application/pdf",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",zip:"application/zip",json:"application/json"};
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
// Shows the finished file with Share / Save buttons so the tap that opens the share sheet is fresh.
function readyBar(blob,name,note){busy(false);return new Promise(resolve=>{const el=$("ready"),ext=name.split(".").pop().toLowerCase(),file=new File([blob],name,{type:MIME[ext]||blob.type||"application/octet-stream"});
 let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 el.innerHTML=`<div><b>Ready</b> <span class="muted">${fmtBytes(blob.size)}</span><div class="nm">${esc(name)}</div>${note?`<div class="muted" style="font-size:13px;margin-top:2px">${esc(note)}</div>`:""}</div>
  <div class="row">${canShare?`<button type="button" class="btn pri" id="rShare">Share or email</button>`:""}<button type="button" class="btn${canShare?"":" pri"}" id="rSave">Save to device</button><button type="button" class="btn ghost" id="rClose" aria-label="Close" style="flex:0 0 auto">✕</button></div>`;
 el.hidden=false;const done=v=>{el.hidden=true;el.innerHTML="";resolve(v)};
 $("rClose").onclick=()=>done(false);
 $("rSave").onclick=()=>{try{downloadBlob(file,name);done(true)}catch(e){toast("This browser couldn't save the file.");done(false)}};
 if(canShare)$("rShare").onclick=async()=>{try{await navigator.share({files:[file],title:name});done(true)}catch(e){if(e&&e.name==="AbortError")return;toast("Couldn't open the share sheet. Use Save to device instead.")}}})}
